version: '3.8'

services:
  accountant-calculator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numerix-calculator
    restart: unless-stopped
    ports:
      - "${PORT:-9330}:3000"
    environment:
      - NODE_ENV=production
      - NUMERIX_DATA_DIR=/data/numerix
    volumes:
      - numerix_data:/data/numerix
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  numerix_data:
    name: numerix_data_persistent
