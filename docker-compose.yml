version: '3.8'

services:
  numerix-calculator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numerix-calculator
    restart: unless-stopped
    ports:
      - "${PORT:-9330}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=Asia/Tehran
      - NUMERIX_DATA_DIR=/data/numerix
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=123
    volumes:
      - numerix_data:/data/numerix
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  numerix_data:
    name: numerix_data_persistent
